# Shared quality-gate pipeline consumed by deploy.yml and dependabot.yml.
# Reusable workflow (not a composite action) so Dependabot can still update
# the pinned action versions inside — it only scans .github/workflows/*.yml.
#
# Runs: lint → lint:md → format:check → type check → unit tests → build → e2e.

name: Quality Gates

on:
  workflow_call:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Lint & format checks ──────────────────────────────────────
      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint Markdown
        run: pnpm lint:md

      # - name: Check formatting (Prettier)
      #   run: pnpm format:check

      # ── Type checking ─────────────────────────────────────────────
      - name: Type check (Astro)
        run: pnpm check

      # ── Unit tests ────────────────────────────────────────────────
      - name: Run unit tests
        run: pnpm test

      # ── Build ─────────────────────────────────────────────────────
      - name: Build site
        run: pnpm build

      # ── E2E tests (needs build output for pnpm preview) ──────────
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
