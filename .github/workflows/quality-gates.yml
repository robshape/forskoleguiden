# Shared quality-gate pipeline consumed by deploy.yml and dependabot.yml.
# Reusable workflow (not a composite action) so Dependabot can still update
# the pinned action versions inside — it only scans .github/workflows/*.yml.
#
# Runs: lint → lint:md → format → type check → unit tests → build → post-build tests → e2e → Lighthouse.

name: Quality Gates

on:
  workflow_call:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # ── Lint & format checks ──────────────────────────────────────
      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint Markdown
        run: pnpm lint:md

      - name: Check formatting (Prettier)
        run: pnpm format

      # ── Type checking ─────────────────────────────────────────────
      - name: Type check (Astro)
        run: pnpm check

      # ── Unit tests ────────────────────────────────────────────────
      - name: Run unit tests
        run: pnpm test

      # ── Build ─────────────────────────────────────────────────────
      - name: Build site
        run: pnpm build

      # ── Post-build unit tests (require dist/) ─────────────────────────────
      - name: Run post-build tests
        run: pnpm test:post-build

      # ── E2E tests (needs build output for pnpm preview) ──────────
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Run WebKit e2e tests
        run: pnpm test:e2e:webkit

      # ── Lighthouse audit (accessibility error gate, performance advisory) ──
      # Runs last: lhci autorun starts its own pnpm preview on port 4321.
      # Placing it after Playwright avoids a port-4321 conflict with the
      # Playwright webServer config that also binds port 4321.
      - name: Run Lighthouse audit
        run: pnpm audit:lighthouse

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lighthouse-results
          path: .lighthouse-results/
          if-no-files-found: ignore
