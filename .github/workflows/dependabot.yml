# Runs quality gates on Dependabot PRs, then auto-approves and squash-merges.
#
# Quality gates (lint, test, build, e2e) are defined once in
# quality-gates.yml and reused here via workflow_call.
#
# Prerequisites:
#   - "Allow auto-merge" must be enabled in repo Settings → General → Pull Requests.
#   - If branch protection is configured, the quality-gates job name must be
#     listed as a required status check for auto-merge to trigger.
#
# Uses GITHUB_TOKEN (GitHub Bot) for all authentication — no PAT needed.

name: Dependabot

on:
  pull_request:
  push:
    branches: [main]

# Cancel previous runs for the same PR; push-to-main runs get unique groups.
concurrency:
  group: dependabot-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Quality gates (reuses shared pipeline) ────────────────────────
  quality-gates:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/quality-gates.yml

  # ── Auto-approve + squash-merge ──────────────────────────────────
  auto-merge:
    needs: quality-gates
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        run: gh pr merge --admin --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
