# Builds, tests, and deploys the static Astro site to GitHub Pages.
# Triggers on every push to main.
# Uses GITHUB_TOKEN (GitHub Bot) for all authentication — no PAT needed.
#
# Quality gates (lint, test, build, e2e) are defined once in
# quality-gates.yml and reused here via workflow_call.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment, skip in-progress runs for new pushes
concurrency:
  group: pages
  cancel-in-progress: true

# Permissions for GitHub Pages deployment + GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Quality gates (lint, test, build, e2e) ─────────────────────────
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml

  # ── Build + upload Pages artifact ────────────────────────────────
  build:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

  # ── Deploy to GitHub Pages ───────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
