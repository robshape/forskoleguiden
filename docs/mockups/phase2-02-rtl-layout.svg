<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
  <rect width="400" height="800" fill="#FAFAFA"/>

  <!-- Header -->
  <rect width="400" height="88" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
  <text x="376" y="56" font-size="18" font-weight="800" fill="#09090B" text-anchor="end" dir="rtl">دليل رياض الأطفال</text>

  <!-- Hamburger Menu RTL -->
  <g transform="translate(16, 32)">
    <rect width="40" height="40" rx="8" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
    <path d="M 12 16 H 28 M 12 20 H 28 M 12 24 H 28" stroke="#09090B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Page Title (RTL) -->
  <text x="376" y="130" font-size="28" font-weight="bold" fill="#09090B" text-anchor="end" dir="rtl">قارن رياض الأطفال</text>
  <text x="376" y="156" font-size="15" font-weight="400" fill="#71717A" text-anchor="end" dir="rtl">مالمو - نتائج استطلاع 2025</text>

  <!-- Sort/Filter Toolbar RTL -->
  <g transform="translate(24, 188)">
    <rect width="352" height="48" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <!-- Simulated Toggle RTL -->
    <rect x="180" y="4" width="168" height="40" rx="6" fill="#F4F4F5"/>
    <text x="264" y="29" font-size="13" font-weight="600" fill="#09090B" text-anchor="middle" dir="rtl">الترتيب حسب: الأفضل تقييماً</text>
    <text x="88" y="29" font-size="13" font-weight="500" fill="#71717A" text-anchor="middle" dir="rtl">أبجدياً</text>
  </g>

  <!-- Preschool Card 1 (RTL) -->
  <g transform="translate(24, 260)">
    <rect width="352" height="180" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <!-- Title right aligned -->
    <text x="328" y="32" font-size="18" font-weight="700" fill="#09090B" text-anchor="end" dir="rtl">روضة ألما</text>
    <text x="328" y="54" font-size="13" font-weight="500" fill="#71717A" text-anchor="end" dir="rtl">بلدية · مالمو</text>

    <!-- Score Badge Left aligned -->
    <rect x="24" y="20" width="48" height="48" rx="12" fill="#ECFDF5"/>
    <text x="48" y="46" font-size="16" font-weight="800" fill="#065F46" text-anchor="middle">88</text>

    <!-- Compare Button RTL -->
    <rect x="24" y="116" width="304" height="44" rx="8" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
    <circle cx="304" cy="138" r="10" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="280" y="143" font-size="14" font-weight="600" fill="#09090B" text-anchor="end" dir="rtl">إضافة للمقارنة (1/5)</text>
  </g>

  <!-- Annotation -->
  <rect x="6" y="460" width="388" height="40" rx="8" fill="#FCE7F3" stroke="#BFDBFE" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="200" y="485" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">RTL Layout active (Right alignment, flipped positions)</text>
</svg>
